services:
  postgres:
    image: postgres:17
    container_name: eventpass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventpass
      POSTGRES_PASSWORD: eventpass_dev
      POSTGRES_DB: eventpass
    ports:
      - "5432:5432"
    volumes:
      - eventpass_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: eventpass-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - eventpass_redis_data:/data

volumes:
  eventpass_postgres_data:
  eventpass_redis_data:
